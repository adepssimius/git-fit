# Pace zones derived from ACTUAL RACE/TIME-TRIAL DATA, not from prescribed targets.
#
# HISTORY: these were originally seeded from the paces Runna prescribed (tempo 5:05, threshold
# 4:55, vo2 4:35, easy ceiling 6:05). Those were contradicted by the athlete's own PRs — a 5k PR
# of 26:30 is 5:18/km, so Runna's "tempo" was FASTER than his best-ever 5k pace, which is not a
# runnable prescription. Everything below is rebuilt from measured performance instead.
#
# Source PRs (all within the 2026 block):
#   5k   26:30   = 5:18/km   <- anchors VO2/speed end
#   10k  56:36   = 5:39/km   <- ~57min effort, so 10k pace ~= threshold (LT2)
#   HM   2:29:51 = 7:06/km   } NOT time trials. Athlete confirms these are the byproduct of
#   30k  3:41:24 = 7:22/km   } block sessions and progressive long runs with slow segments at
#                              both ends — so the average pace is dragged down by design and
#                              UNDERSTATES real capability. Do not use them to set zones.
#
# Zones are therefore anchored ONLY on the 5k/10k, which are genuine efforts and mutually
# consistent (pace ratio 1.068, textbook). Riegel from the 10k predicts a ~2:05 half (5:55/km)
# versus the 2:29 training-run figure, which is the size of the gap those slow bookends create.
#
# Standing caveat: because no long time trial exists, the endurance end of this table is an
# estimate extrapolated from 10k fitness, and extrapolation flatters runners whose long-run
# volume is limited. Treat the easy/long numbers as a starting hypothesis to be corrected with
# real data from the Big Day and the lap simulations — that's what pace_review below is for.

units: { distance: km, pace: min_per_km, load: lb }

pace:
  # THE most important number here. This is a CEILING, not a target: easy days must be no
  # FASTER than this, and slower is always fine. Given the speed/endurance gap above, running
  # easy days too fast is this athlete's most likely training error, and the one that would
  # quietly wreck an ultra build. If 7:00 feels like work, go slower.
  easy_ceiling: "7:00"
  recovery: "7:45"           # day-after-long-run and shakeout pace

  long_run: "6:50-7:10"      # long-run cruising, easy effort
  long_steady: "6:30"         # the "steady" segments inside progressive long runs
  steady: "6:15"              # marathon-ish effort
  tempo: "5:55"               # sustained ~40-60min effort
  threshold: "5:40"          # = 10k PR pace; his 10k takes ~57min so this IS ~1-hour pace
  vo2: "5:18"                # = 5k PR pace
  rep: "5:05"                # short reps (200-400m), ~3k effort
  stride: "4:35"             # 20-30s strides — fast but not sprinting form

  walk_recovery: "9:00"      # all interval rest steps and race walk breaks

  # Ultra targets. Deliberately far slower than anything above: at an 11:11/km cutoff average
  # for 100mi, the failure mode is starting anywhere near normal easy pace. Lap 1 should feel
  # almost embarrassingly slow. These are MOVING paces, excluding crew stops.
  ultra_lap_early: "8:15-8:45"    # laps 1-2
  ultra_lap_late: "9:45-11:00"    # laps 4+, run/walk

# Re-test triggers: update this file when a new PR lands, or after the Big Day (block week 13)
# and each lap simulation, which give real long-effort data at ultra pace.
pace_review:
  last_updated: "2026-08-03"
  next_review: "after the Big Day, 2026-09-05"

hr:
  # HRmax observed 187 during the 2026-08-02 30k, above the 186 the watch had stored.
  max_observed: 187

  # LTHR is ESTIMATED, not measured — but bounded usefully from both directions:
  #   FLOOR:  averaged 159 bpm for 3h31 on 2026-08-02. You cannot hold above threshold for
  #           three and a half hours, so LTHR is comfortably ABOVE 159.
  #   CEILING: treadmill efforts of 42-66min averaged 147-151 (max 177-181), and the athlete
  #           reports having had 2-3 min in hand — so those weren't maximal.
  # Best estimate ~170. Confirm with a real test before treating it as precise.
  lthr_estimated: 170
  lthr_measured: null        # TODO: 30min TT, average HR of the final 20min

  # Friel LTHR-based zones (more useful here than %max, given LTHR is the better-bounded number)
  zones:
    z1_recovery: "<138"      # <81% LTHR
    z2_aerobic: "138-151"    # 81-89%  <- where the bulk of long-run time belongs
    z3_steady: "153-158"     # 90-93%
    z4_threshold: "160-168"  # 94-99%
    z5: ">170"

  # Re-reading the two known sessions against these:
  #   2026-08-03 easy, avg 131  -> Z1. Genuinely gentle; correct the day after a 30k.
  #   2026-08-02 30k,  avg 159  -> Z3 steady, NOT threshold. Firm for a long run but defensible,
  #                                especially with a deliberate 10k effort inside it and 86F heat.
  long_run_hr_ceiling: 155   # aim Z2, allow drift into low Z3 on hot days or with efforts inside

  # ⚠️ TREADMILL DISTANCE IS UNRELIABLE. Every recorded treadmill session shows 6:11-6:46/km at
  # avg HR 147-151, which cannot be reconciled with a 56:36 10k (5:39/km). Wrist-based distance
  # on a treadmill is the likely culprit. Do NOT derive pace zones from treadmill sessions —
  # use their HR only.

bike:
  ftp_w: null                # TODO: ramp or 20-min test on the trainer
  z2_w: null                 # ~56-75% FTP — the only zone meeting-time trainer sessions use
  cadence: "85-95rpm"

bodyweight_lb: null          # TODO
