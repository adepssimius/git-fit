name: Build and deploy calendar to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel a run that's mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The plan's own invariants gate the deploy. A week that busts the time budget,
      # the long-run cap, or the `m`-means-minutes trap fails the build rather than
      # quietly publishing a broken plan.
      - name: Verify plan invariants
        run: python3 scripts/verify_plan.py

      - name: Build calendar
        run: |
          mkdir -p _site
          python3 scripts/generate_calendar.py --out _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
